name: Build Bingr TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BingrTV-AndroidTV-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project
        run: |
          mkdir build-src
          unzip -q BingrTV-AndroidTV-Project.zip -d build-src
          test -f build-src/BingrTV/settings.gradle.kts

      - name: Build APK
        working-directory: build-src/BingrTV
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BingrTV-debug-apk
          path: build-src/BingrTV/app/build/outputs/apk/debug/app-debug.apk
